# Joint limits for UR10e used by MoveIt2 planning.
# Constrained to a single [-pi, pi] range to prevent branch flipping.

joint_limits:
  shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 2.0943951
    has_acceleration_limits: true
    max_acceleration: 3.14159265
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159

  shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 2.0943951
    has_acceleration_limits: true
    max_acceleration: 3.14159265
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159

  elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265
    has_acceleration_limits: true
    max_acceleration: 3.14159265
    has_position_limits: true
    # Narrow range: force elbow to stay positive (elbow-up branch)
    min_position: 0.0
    max_position: 3.14159

  wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265
    has_acceleration_limits: true
    max_acceleration: 3.14159265
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159

  wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265
    has_acceleration_limits: true
    max_acceleration: 3.14159265
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159

  wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265
    has_acceleration_limits: true
    max_acceleration: 3.14159265
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
